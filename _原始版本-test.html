<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>无聊时可以做的 100 件小事</title>
<style>
  :root {
    --bg: #f7f5f0;
    --card: #ffffff;
    --text: #2c2c2c;
    --muted: #8a8580;
    --accent: #e07a5f;
    --border: #ebe6de;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .app { max-width: 640px; margin: 0 auto; padding: 0 20px 80px; }

  /* 头部 */
  header { padding: 48px 0 24px; }
  h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: .01em; font-weight: 600; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
  .progress-bar { height: 6px; background: #e8e3da; border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .5s cubic-bezier(.4,0,.2,1); }
  .progress-meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 8px; }

  /* 按钮 */
  button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  .btn {
    padding: 8px 16px; border-radius: 999px; background: #fff;
    border: 1px solid var(--border); font-size: 14px; transition: all .15s ease;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { opacity: .88; color: #fff; }

  /* 工具栏 */
  .toolbar { display: flex; gap: 8px; margin-bottom: 16px; }

  /* 标签筛选 */
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .chip {
    padding: 5px 12px; border-radius: 999px; font-size: 13px;
    background: #fff; border: 1px solid var(--border); color: var(--muted);
    transition: all .15s ease;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.active { background: var(--text); border-color: var(--text); color: #fff; }

  /* 列表 */
  #list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  .card {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 16px; background: var(--card); border-radius: 14px;
    border: 1px solid var(--border); animation: fadeIn .25s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .check {
    width: 22px; height: 22px; flex-shrink: 0; margin-top: 2px;
    border-radius: 50%; border: 1.5px solid #d5cfc6;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; color: transparent; transition: all .15s ease;
  }
  .check:hover { border-color: var(--accent); }
  .card.done .check { background: var(--accent); border-color: var(--accent); color: #fff; }

  .card .body { flex: 1; min-width: 0; }
  .card .text { font-size: 15px; word-break: break-word; transition: color .2s; }
  .card.done .text { text-decoration: line-through; color: #b8b0a5; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .tag { font-size: 12px; color: var(--muted); background: #f4f1eb; padding: 2px 8px; border-radius: 6px; }

  .note { margin-top: 10px; font-size: 13px; cursor: pointer; line-height: 1.5; }
  .note.placeholder { color: #bcb4a9; }
  .note.has-note {
    color: #6b6259; background: #faf7f2; padding: 8px 12px;
    border-radius: 8px; border-left: 2px solid var(--accent);
    white-space: pre-wrap; word-break: break-word;
  }

  .del { color: #d8d2c9; font-size: 20px; line-height: 1; padding: 0 2px; transition: color .15s; }
  .del:hover { color: #e05555; }

  .empty { text-align: center; color: var(--muted); padding: 48px 0; font-size: 14px; list-style: none; }

  /* 添加区 */
  .add-box {
    margin-top: 20px; padding: 16px; background: #fff;
    border-radius: 14px; border: 1px dashed var(--border);
    display: flex; flex-direction: column; gap: 8px;
  }
  input, textarea {
    font: inherit; width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: #faf9f6;
    outline: none; color: var(--text); resize: vertical;
  }
  input:focus, textarea:focus { border-color: var(--accent); background: #fff; }
  input::placeholder, textarea::placeholder { color: #bcb4a9; }
  .add-row { display: flex; gap: 8px; }
  .add-row input { flex: 1; }

  /* 弹窗 */
  .overlay {
    position: fixed; inset: 0; background: rgba(40, 35, 30, .38);
    display: none; align-items: center; justify-content: center;
    padding: 20px; z-index: 100; backdrop-filter: blur(2px);
  }
  .overlay.show { display: flex; animation: fadeIn .2s ease; }
  .modal {
    background: #fff; border-radius: 18px; padding: 28px;
    max-width: 420px; width: 100%;
    box-shadow: 0 24px 64px rgba(0,0,0,.18);
    animation: pop .25s cubic-bezier(.34,1.4,.64,1);
  }
  @keyframes pop { from { transform: scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal .label { font-size: 12px; color: var(--muted); letter-spacing: .08em; margin-bottom: 10px; }
  .modal h2 { font-size: 19px; margin: 0 0 12px; line-height: 1.45; font-weight: 600; }
  .modal p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; flex-wrap: wrap; }
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>无聊时可以做的 100 件小事</h1>
    <p class="sub">慢慢收集，慢慢去做。</p>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-meta">
      <span id="progressText">已收集 0 / 100</span>
      <span id="doneText">已完成 0 件</span>
    </div>
  </header>

  <div class="toolbar">
    <button class="btn primary" id="randomBtn">🎲 随便来一件</button>
  </div>

  <div class="filters" id="filters"></div>

  <ul id="list"></ul>

  <div class="add-box">
    <input id="newText" placeholder="添加一件小事…" autocomplete="off">
    <div class="add-row">
      <input id="newTags" placeholder="标签，用逗号分隔（可选）" autocomplete="off">
      <button class="btn" id="addBtn">添加</button>
    </div>
  </div>

</div>

<!-- 随机抽一件 -->
<div class="overlay" id="randomOverlay">
  <div class="modal">
    <div class="label">不如就做这件吧</div>
    <h2 id="randomText"></h2>
    <div class="tags" id="randomTags"></div>
    <div class="modal-actions">
      <button class="btn" id="randomClose">关掉</button>
      <button class="btn" id="randomAgain">换一个</button>
      <button class="btn primary" id="randomDone">我做完啦</button>
    </div>
  </div>
</div>

<!-- 记录感受 -->
<div class="overlay" id="noteOverlay">
  <div class="modal">
    <div class="label">做完啦 🎉</div>
    <h2 id="noteItemText"></h2>
    <textarea id="noteInput" rows="3" placeholder="有什么想说的吗？（可以留空）"></textarea>
    <div class="modal-actions">
      <button class="btn" id="noteCancel">取消</button>
      <button class="btn primary" id="noteSave">保存</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var KEY = 'boring100.v1';

  function uid() {
    return Math.random().toString(36).slice(2, 10);
  }

  // 初始示例数据，你可以随意删掉
  function seed() {
    var raw = [
      ['去楼下走一条没走过的小路', ['出门', '10分钟', '不花钱']],
      ['整理手机里 100 张截图', ['整理', '在家']],
      ['给一个很久没联系的朋友发条消息', ['社交', '5分钟']],
      ['煮一杯没喝过的茶', ['在家', '动手']],
      ['写 300 字今天发生的事', ['创作', '在家']],
      ['把书桌擦一遍', ['整理', '在家', '10分钟']],
      ['从头到尾听一张专辑', ['放松', '30分钟']],
      ['去便利店买一样没吃过的东西', ['出门', '10分钟']],
      ['把书架上的书重新按心情排一次', ['整理', '在家']],
      ['坐着看窗外十分钟，什么都不干', ['放松', '10分钟', '不花钱']]
    ];
    return raw.map(function (r) {
      return { id: uid(), text: r[0], tags: r[1], done: false, note: '', date: '' };
    });
  }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return seed();
      var data = JSON.parse(raw);
      if (!Array.isArray(data)) return seed();
      return data;
    } catch (e) {
      return seed();
    }
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {}
  }

  var items = load();
  var filter = 'all';
  var currentRandomId = null;
  var noteId = null;

  var $ = function (id) { return document.getElementById(id); };

  /* ---------------- 渲染 ---------------- */

  function render() {
    var doneCount = items.filter(function (i) { return i.done; }).length;

    $('progressText').textContent = '已收集 ' + items.length + ' / 100';
    $('doneText').textContent = '已完成 ' + doneCount + ' 件';
    $('progressFill').style.width = Math.min(100, items.length) + '%';

    renderFilters();
    renderList();
  }

  function renderFilters() {
    var set = {};
    items.forEach(function (i) {
      i.tags.forEach(function (t) { set[t] = true; });
    });
    var tags = Object.keys(set);

    var wrap = $('filters');
    wrap.innerHTML = '';

    if (tags.length === 0) return;

    var all = makeChip('all', '全部');
    wrap.appendChild(all);

    tags.forEach(function (t) {
      wrap.appendChild(makeChip(t, t));
    });
  }

  function makeChip(value, label) {
    var b = document.createElement('button');
    b.className = 'chip' + (filter === value ? ' active' : '');
    b.textContent = label;
    b.onclick = function () {
      filter = (filter === value && value !== 'all') ? 'all' : value;
      render();
    };
    return b;
  }

  function renderList() {
    var list = $('list');
    list.innerHTML = '';

    var shown = items.filter(function (i) {
      if (filter !== 'all' && i.tags.indexOf(filter) === -1) return false;
      return true;
    });

    if (shown.length === 0) {
      var li = document.createElement('li');
      li.className = 'empty';
      li.textContent = items.length === 0 ? '还什么都没写，先加一件试试？' : '这个标签下还没有内容';
      list.appendChild(li);
      return;
    }

    shown.forEach(function (it) {
      list.appendChild(cardEl(it));
    });
  }

  function cardEl(it) {
    var li = document.createElement('li');
    li.className = 'card' + (it.done ? ' done' : '');

    // 勾选
    var check = document.createElement('button');
    check.className = 'check';
    check.textContent = '✓';
    check.title = it.done ? '标记为未完成' : '标记为已完成';
    check.onclick = function () { toggleDone(it.id); };
    li.appendChild(check);

    // 主体
    var body = document.createElement('div');
    body.className = 'body';

    var text = document.createElement('div');
    text.className = 'text';
    text.textContent = it.text;
    body.appendChild(text);

    if (it.tags && it.tags.length) {
      var tags = document.createElement('div');
      tags.className = 'tags';
      it.tags.forEach(function (t) {
        var s = document.createElement('span');
        s.className = 'tag';
        s.textContent = t;
        tags.appendChild(s);
      });
      body.appendChild(tags);
    }

    if (it.done) {
      var note = document.createElement('div');
      note.className = 'note ' + (it.note ? 'has-note' : 'placeholder');
      note.textContent = it.note ? it.note : '＋ 记点什么';
      note.onclick = function () { openNote(it.id); };
      body.appendChild(note);
    }

    li.appendChild(body);

    // 删除
    var del = document.createElement('button');
    del.className = 'del';
    del.textContent = '×';
    del.title = '删除';
    del.onclick = function () {
      if (window.confirm('删掉这条？')) {
        items = items.filter(function (x) { return x.id !== it.id; });
        save();
        render();
      }
    };
    li.appendChild(del);

    return li;
  }

  /* ---------------- 操作 ---------------- */

  function toggleDone(id) {
    var it = find(id);
    if (!it) return;

    if (it.done) {
      it.done = false;
      it.date = '';
      save();
      render();
    } else {
      it.done = true;
      it.date = new Date().toLocaleDateString('zh-CN');
      save();
      render();
      openNote(id);   // 完成后顺手记一笔
    }
  }

  function find(id) {
    for (var i = 0; i < items.length; i++) {
      if (items[i].id === id) return items[i];
    }
    return null;
  }

  function addItem() {
    var textInput = $('newText');
    var tagInput = $('newTags');
    var text = textInput.value.trim();
    if (!text) { textInput.focus(); return; }

    var tags = tagInput.value
      .split(/[,，、\s]+/)
      .map(function (s) { return s.trim(); })
      .filter(Boolean);

    items.unshift({
      id: uid(),
      text: text,
      tags: tags,
      done: false,
      note: '',
      date: ''
    });

    textInput.value = '';
    tagInput.value = '';
    save();
    render();
    textInput.focus();
  }

  /* ---------------- 随机 ---------------- */

  function pickRandom() {
    var pool = items.filter(function (i) {
      if (i.done) return false;
      if (filter !== 'all' && i.tags.indexOf(filter) === -1) return false;
      return true;
    });

    // 如果没剩未完成的，就放宽条件
    if (pool.length === 0) {
      pool = items.filter(function (i) {
        return filter === 'all' || i.tags.indexOf(filter) !== -1;
      });
    }

    if (pool.length === 0) {
      alert('还没有可以抽的小事，先添加几件吧～');
      return;
    }

    var pick = pool[Math.floor(Math.random() * pool.length)];
    currentRandomId = pick.id;

    $('randomText').textContent = pick.text;
    var tagWrap = $('randomTags');
    tagWrap.innerHTML = '';
    (pick.tags || []).forEach(function (t) {
      var s = document.createElement('span');
      s.className = 'tag';
      s.textContent = t;
      tagWrap.appendChild(s);
    });

    $('randomOverlay').classList.add('show');
  }

  /* ---------------- 弹窗 ---------------- */

  function openNote(id) {
    var it = find(id);
    if (!it) return;
    noteId = id;
    $('noteItemText').textContent = it.text;
    $('noteInput').value = it.note || '';
    $('noteOverlay').classList.add('show');
    setTimeout(function () { $('noteInput').focus(); }, 60);
  }

  function closeNote() {
    $('noteOverlay').classList.remove('show');
    noteId = null;
  }

  /* ---------------- 事件绑定 ---------------- */

  $('addBtn').onclick = addItem;

  $('newText').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); addItem(); }
  });

  $('newTags').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); addItem(); }
  });

  $('randomBtn').onclick = pickRandom;
  $('randomAgain').onclick = pickRandom;
  $('randomClose').onclick = function () {
    $('randomOverlay').classList.remove('show');
  };

  $('randomDone').onclick = function () {
    $('randomOverlay').classList.remove('show');
    if (currentRandomId) {
      var it = find(currentRandomId);
      if (it && !it.done) {
        it.done = true;
        it.date = new Date().toLocaleDateString('zh-CN');
        save();
        render();
      }
      openNote(currentRandomId);
    }
  };

  $('noteSave').onclick = function () {
    var it = find(noteId);
    if (it) {
      it.note = $('noteInput').value.trim();
      save();
      render();
    }
    closeNote();
  };

  $('noteCancel').onclick = closeNote;

  // 点击遮罩关闭
  $('randomOverlay').addEventListener('click', function (e) {
    if (e.target === this) this.classList.remove('show');
  });
  $('noteOverlay').addEventListener('click', function (e) {
    if (e.target === this) closeNote();
  });

  // Esc 关闭
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      $('randomOverlay').classList.remove('show');
      if ($('noteOverlay').classList.contains('show')) closeNote();
    }
  });

  /* ---------------- 启动 ---------------- */

  render();
  if (!localStorage.getItem(KEY)) save();

})();
</script>
</body>
</html>
